<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кто выгуливает Бориса</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      line-height: 1.4;
      background: #f3efe6;
      color: #241c14;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 40px;
    }

    header, main {
      width: min(1040px, 100%);
      margin: 0 auto;
    }

    header { margin-bottom: 20px; }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
    }

    .logo-mark {
      width: 52px;
      height: 52px;
      flex: none;
    }

    .logo-name {
      margin: 0;
      color: #1a1a1a;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    h1, h2 { margin: 0; font-weight: 650; }

    h1 { font-size: 2rem; }

    #today {
      margin: 8px 0 0;
      font-size: 1.15rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      align-items: start;
    }

    section, aside, .slot {
      background: #fffdf8;
      border: 1px solid #e2d8c8;
      border-radius: 16px;
    }

    section, aside { padding: 16px; }

    h2 { margin-bottom: 12px; font-size: 1.15rem; }

    .slots {
      display: grid;
      gap: 10px;
    }

    .slot {
      display: grid;
      gap: 8px;
      padding: 12px;
    }

    .slot-free { border-color: #b7c9a8; }

    .slot-busy {
      background: #f4e7cf;
      border-color: #c6a15a;
    }

    .slot-time {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .slot-state {
      margin: 0;
      font-size: 0.95rem;
    }

    .slot form, #feeding-form {
      display: grid;
      gap: 8px;
    }

    label { display: grid; gap: 4px; font-size: 0.95rem; }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfc3b2;
      border-radius: 10px;
      font: inherit;
    }

    button {
      width: fit-content;
      padding: 10px 14px;
      border: 0;
      border-radius: 999px;
      background: #2f6f4e;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .error {
      margin: 0;
      color: #8a2f1b;
    }

    .feeding-name, .feeding-time { margin: 0; }

    .feeding-name { font-size: 1.15rem; font-weight: 700; }

    @media (max-width: 760px) {
      body { padding: 16px 12px 28px; }
      h1 { font-size: 1.6rem; }
      .logo-mark { width: 44px; height: 44px; }
      .logo-name { font-size: 1.25rem; }
      main { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="18" fill="#F5C400"/>
        <g fill="#1A1A1A">
          <circle cx="16" cy="24" r="6"/>
          <circle cx="28" cy="15" r="6"/>
          <circle cx="42" cy="15" r="6"/>
          <circle cx="52" cy="26" r="5.5"/>
          <ellipse cx="33" cy="42" rx="14" ry="11"/>
        </g>
      </svg>
      <p class="logo-name">Догяндекс</p>
    </div>
    <h1>Кто выгуливает Бориса</h1>
    <p id="today"></p>
  </header>
  <main>
    <section aria-labelledby="walks-title">
      <h2 id="walks-title">Прогулки</h2>
      <p class="error" id="notice" hidden></p>
      <div class="slots" id="slots"></div>
    </section>
    <aside aria-labelledby="feeding-title">
      <h2 id="feeding-title">Последнее кормление</h2>
      <div id="feeding-card">
        <p id="feeding-empty">Пока никто не отметил кормление.</p>
      </div>
      <form id="feeding-form">
        <label>
          ФИО
          <input name="name" autocomplete="name" placeholder="Илья Примеров">
        </label>
        <button type="submit">Отметить кормление</button>
        <p class="error" id="feeding-error" hidden></p>
      </form>
    </aside>
  </main>
  <script>
    const slotsRoot = document.querySelector("#slots");
    const feedingCard = document.querySelector("#feeding-card");
    const feedingForm = document.querySelector("#feeding-form");
    const feedingError = document.querySelector("#feeding-error");
    const notice = document.querySelector("#notice");

    function cleanName(value) {
      return value.trim().replace(/\s+/g, " ");
    }

    function showNotice(message) {
      notice.hidden = !message;
      notice.textContent = message || "";
    }

    function formatFedAt(iso) {
      return new Intl.DateTimeFormat("ru-RU", {
        timeZone: "Europe/Moscow",
        day: "numeric",
        month: "long",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(iso));
    }

    function renderFeeding(feeding) {
      feedingCard.replaceChildren();
      if (!feeding) {
        const empty = document.createElement("p");
        empty.id = "feeding-empty";
        empty.textContent = "Пока никто не отметил кормление.";
        feedingCard.append(empty);
        return;
      }
      const nameNode = document.createElement("p");
      nameNode.className = "feeding-name";
      nameNode.textContent = feeding.employeeName;
      const timeNode = document.createElement("p");
      timeNode.className = "feeding-time";
      timeNode.textContent = formatFedAt(feeding.fedAt);
      feedingCard.append(nameNode, timeNode);
    }

    function renderSlot(slot) {
      const article = document.createElement("article");
      article.className = slot.bookedBy ? "slot slot-busy" : "slot slot-free";
      article.dataset.time = slot.time;
      const timeNode = document.createElement("p");
      timeNode.className = "slot-time";
      timeNode.textContent = slot.time;
      const stateNode = document.createElement("p");
      stateNode.className = "slot-state";
      article.append(timeNode, stateNode);
      if (slot.bookedBy) {
        stateNode.textContent = "Занято";
        const nameNode = document.createElement("p");
        nameNode.className = "slot-name";
        nameNode.textContent = slot.bookedBy;
        article.append(nameNode);
        return article;
      }
      stateNode.textContent = "Свободно";
      const form = document.createElement("form");
      form.innerHTML = `
        <label>
          ФИО
          <input name="name" autocomplete="name" placeholder="Анна Тестова">
        </label>
        <button type="submit">Записаться</button>
        <p class="error" hidden></p>
      `;
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = form.elements.name;
        const error = form.querySelector(".error");
        const name = cleanName(input.value);
        error.hidden = true;
        if (!name) {
          error.hidden = false;
          error.textContent = "Введите ФИО.";
          input.focus();
          return;
        }
        const response = await fetch("/api/bookings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ slotTime: slot.time, name })
        });
        const payload = await response.json();
        if (response.status === 409) {
          showNotice(payload.error);
          renderState(payload.state);
          return;
        }
        if (!response.ok) {
          error.hidden = false;
          error.textContent = payload.error || "Не удалось записать.";
          return;
        }
        showNotice("");
        renderState(payload);
      });
      article.append(form);
      return article;
    }

    function renderState(state) {
      document.querySelector("#today").textContent = state.dateLabel;
      slotsRoot.replaceChildren(...state.slots.map(renderSlot));
      renderFeeding(state.feeding);
    }

    async function loadState() {
      const response = await fetch("/api/state");
      if (!response.ok) {
        showNotice("Не удалось загрузить записи.");
        return;
      }
      renderState(await response.json());
    }

    feedingForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = cleanName(feedingForm.elements.name.value);
      feedingError.hidden = true;
      if (!name) {
        feedingError.hidden = false;
        feedingError.textContent = "Введите ФИО.";
        feedingForm.elements.name.focus();
        return;
      }
      const response = await fetch("/api/feedings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      const payload = await response.json();
      if (!response.ok) {
        feedingError.hidden = false;
        feedingError.textContent = payload.error || "Не удалось отметить кормление.";
        return;
      }
      feedingForm.reset();
      renderState(payload);
    });

    loadState();
  </script>
</body>
</html>
